<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নগদ উদ্যোক্তা QR কোড জেনারেটর</title>
    <!-- QRCode.js লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* কন্ট্রোল প্যানেল */
        .control-panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }

        .control-panel h3 {
            margin-bottom: 15px;
            color: #d11241;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-download { background-color: #28a745; }
        .btn-download:hover { background-color: #218838; }
        
        .btn-print { background-color: #007bff; }
        .btn-print:hover { background-color: #0056b3; }

        /* মূল পোস্টার ফ্রেম */
        .poster-frame {
            border: 2px solid #000000;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* ওপরের লাল অংশ */
        .top-section {
            background-color: #d11241;
            color: white;
            padding: 20px 15px;
            text-align: center;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 13px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            color: #fff;
        }

        .logo-area {
            background: white;
            padding: 5px 12px;
            border-radius: 6px;
            text-align: center;
        }

        .logo-area img {
            height: 32px;
            display: block;
            margin: 0 auto;
        }

        .logo-area span {
            display: block;
            font-size: 9px;
            margin-top: 2px;
            color: #d11241;
            font-weight: bold;
        }

        .main-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .sub-title {
            font-size: 14px;
            margin-bottom: 15px;
            color: #fbebee;
        }

        /* কিউআর কোড হোয়াইট বক্স */
        .qr-box-wrapper {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #qrcode canvas, #qrcode img {
            display: block;
            margin: 0 auto;
            width: 180px !important;
            height: 180px !important;
        }

        .account-label {
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 10px;
            color: #fff;
        }

        /* ১১ ডিজিট অ্যাকাউন্ট নম্বর ঘর */
        .account-digits {
            display: flex;
            justify-content: center;
            gap: 3px;
            background: white;
            padding: 8px;
            border-radius: 8px;
            max-width: 100%;
            overflow-x: auto;
        }

        .digit-box {
            background: #ffffff;
            color: #d11241;
            font-size: 18px;
            font-weight: bold;
            width: 28px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .digit-separator {
            color: #d11241;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        /* মাঝের হলুদ অংশ */
        .middle-yellow {
            background-color: #ffc107;
            color: #000;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        /* নিচের সাদা অংশ */
        .bottom-white {
            background-color: #ffffff;
            color: #333;
            padding: 20px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 6px 0;
            font-size: 13px;
        }

        .info-label {
            width: 28%;
            font-weight: bold;
            color: #444;
        }

        .info-colon {
            width: 4%;
            text-align: center;
            font-weight: bold;
        }

        .info-value {
            width: 68%;
            font-weight: 600;
            color: #111;
        }

        /* একদম নিচের গাঢ় লাল ফুটার অংশ */
        .footer-red {
            background-color: #d11241;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        @media print {
            .control-panel {
                display: none;
            }
            body {
                background: white;
                padding: 0;
            }
            .poster-frame {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>

    <!-- কন্ট্রোল প্যানেল -->
    <div class="control-panel">
        <h3>উদ্যোক্তার তথ্য ও QR কোড এডিটর</h3>
        <div class="form-group">
            <label>নাম:</label>
            <input type="text" id="inputName" value=" " oninput="updatePoster()">
        </div>
        <div class="form-group">
            <label>দোকানের নাম:</label>
            <input type="text" id="inputShop" value=" " oninput="updatePoster()">
        </div>
        <div class="form-group">
            <label>ঠিকানা:</label>
            <input type="text" id="inputAddress" value=" " oninput="updatePoster()">
        </div>
        <div class="form-group">
            <label>আইডি:</label>
            <input type="text" id="inputID" value="A609851" oninput="updatePoster()">
        </div>
        <div class="form-group">
            <label>নগদ অ্যাকাউন্ট নম্বর (১১ ডিজিট):</label>
            <input type="text" id="inputPhone" maxlength="11" value="01#########" oninput="updatePoster()">
        </div>
        
        <div class="btn-container">
            <button class="btn btn-download" onclick="downloadPosterImage()">ডাউনলোড ছবি</button>
            <button class="btn btn-print" onclick="window.print()">প্রিন্ট / PDF সেভ</button>
        </div>
    </div>

    <!-- মূল পোস্টার ডিজাইন ফ্রেম -->
    <div class="poster-frame" id="posterArea">
        
        <!-- ওপরের লাল অংশ -->
        <div class="top-section">
            <div class="header-top">
                <div class="Bold tagline">দেশি নগদে বেশি লাভ</div>
                <div class="logo-area">
                    <!-- বিকল্প সরাসরি নির্ভরযোগ্য লোগো সোর্স ব্যবহার করা হয়েছে -->
                    <img src="https://seeklogo.com/images/N/nagad-logo-355240/seeklogo.com.png" alt="Nagad Logo" crossorigin="anonymous">
                    <span>ডাক বিভাগের ডিজিটাল লেনদেন</span>
                </div>
            </div>

            <div class="main-title">নগদ উদ্যোক্তা</div>
            <div class="sub-title">ক্যাশ আউট করতে QR কোডটি স্ক্যান করুন</div>

            <div class="qr-box-wrapper">
                <div id="qrcode"></div>
            </div>

            <div class="account-label">নগদ উদ্যোক্তা একাউন্ট নাম্বার</div>

            <!-- ১১ ডিজিটের আলাদা ঘর -->
            <div class="account-digits" id="digitContainer"></div>
        </div>

        <!-- মাঝের হলুদ অংশ -->
        <div class="middle-yellow">
            উদ্যোক্তার তথ্যাবলি
        </div>

        <!-- নিচের সাদা অংশ -->
        <div class="bottom-white">
            <table class="info-table">
                <tr>
                    <td class="info-label">নাম</td>
                    <td class="info-colon">:</td>
                    <td class="info-value" id="displayName"> </td>
                </tr>
                <tr>
                    <td class="info-label">দোকানের নাম</td>
                    <td class="info-colon">:</td>
                    <td class="info-value" id="displayShop"> </td>
                </tr>
                <tr>
                    <td class="info-label">ঠিকানা</td>
                    <td class="info-colon">:</td>
                    <td class="info-value" id="displayAddress"> </td>
                </tr>
                <tr>
                    <td class="info-label">আইডি</td>
                    <td class="info-colon">:</td>
                    <td class="info-value" id="displayID">A609851</td>
                </tr>
            </table>
        </div>

        <!-- একদম নিচের গাঢ় লাল অংশ -->
        <div class="footer-red">
            <span>nagad.com.bd</span> | <span>📞 16167</span> | <span>096 096 16167</span>
        </div>

    </div>

    <!-- html2canvas লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        let qrcodeObj = new QRCode(document.getElementById("qrcode"), {
            text: "018########",
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function updatePoster() {
            const name = document.getElementById('inputName').value;
            const shop = document.getElementById('inputShop').value;
            const address = document.getElementById('inputAddress').value;
            const id = document.getElementById('inputID').value;
            let phone = document.getElementById('inputPhone').value.replace(/\D/g, '');

            if(phone.length > 11) phone = phone.slice(0, 11);

            document.getElementById('displayName').innerText = name;
            document.getElementById('displayShop').innerText = shop;
            document.getElementById('displayAddress').innerText = address;
            document.getElementById('displayID').innerText = id;

            let digitContainer = document.getElementById('digitContainer');
            digitContainer.innerHTML = '';

            for (let i = 0; i < 11; i++) {
                let char = phone[i] !== undefined ? phone[i] : '0';
                let box = document.createElement('div');
                box.className = 'digit-box';
                box.innerText = char;
                digitContainer.appendChild(box);

                if (i === 2 || i === 6) {
                    let sep = document.createElement('div');
                    sep.className = 'digit-separator';
                    sep.innerText = '-';
                    digitContainer.appendChild(sep);
                }
            }

            let qrText = phone ? phone : "01#########";
            qrcodeObj.clear();
            qrcodeObj.makeCode(qrText);
        }

        function downloadPosterImage() {
            const controlPanel = document.querySelector('.control-panel');
            controlPanel.style.display = 'none';

            const poster = document.getElementById('posterArea');
            html2canvas(poster, { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'nagad-qr-code.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                controlPanel.style.display = 'block';
            });
        }

        window.onload = function() {
            updatePoster();
        }
    </script>
</body>
</html>
